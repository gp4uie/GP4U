<meta charset="utf-8">

<title>Admin Login — GP4U</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">

<body class="clinic-page staff-page">

<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header staff-header">
  <div class="nav-wrap">
    <a class="brand" href="/admin-login.html" aria-label="GP4U Clinic — Admin"><picture class="brand-logo"><source media="(max-width: 440px)" srcset="/img/gp4u-logo-short.webp" width="138" height="48"><img src="/img/gp4u-logo.webp" alt="GP4U Clinic" width="216" height="48"></picture></a>
    <span class="staff-role">Admin</span>
    <nav class="main-nav" aria-label="Account">
      
    </nav>
  </div>
</header>
<main id="main">

<div class="page-shell" style="max-width:380px;">
  <h1>Admin Login</h1>
  <form id="loginForm" onsubmit="event.preventDefault(); login();" novalidate>
  <div class="form-row"><label for="emailInput">Email</label><input type="email" id="emailInput" name="username" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
  <div class="form-row"><label for="passwordInput">Password</label><input type="password" id="passwordInput" name="password" autocomplete="current-password" autocapitalize="none"></div>
  <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Log In</button>
  </form>
  <p id="loginError" role="alert" style="color:#c0392b;"></p>
  <p><a href="#" id="forgotLink">Forgot your password?</a></p>

  <div id="forgotBox" style="display:none;">
    <div class="form-row"><label>Email</label><input type="email" id="forgotEmailInput"></div>
    <button class="btn btn-secondary btn-block" onclick="submitForgot()">Send Reset Link</button>
    <p id="forgotMsg"></p>
  </div>
</div>

</main>

<script>
let loginInFlight = false;
async function login() {
  if (loginInFlight) return;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Please enter your email and password.'; return; }
  loginInFlight = true;
  if (btn) { btn.disabled = true; btn.textContent = 'Signing in…'; }
  let ok = false;
  try {
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { ok = true; window.location.href = '/admin-dashboard.html'; return; }
    errEl.textContent = data.error || `Sign-in failed (error ${res.status}). Please try again.`;
  } catch (err) {
    errEl.textContent = 'Could not reach the server. Check your internet connection and try again.';
  } finally {
    loginInFlight = false;
    if (btn && !ok) { btn.disabled = false; btn.textContent = 'Log In'; }
  }
}

document.getElementById('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('forgotBox').style.display = 'block';
  e.target.style.display = 'none';
});

async function submitForgot() {
  const email = document.getElementById('forgotEmailInput').value;
  const res = await fetch('/api/admin/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });
  const data = await res.json();
  document.getElementById('forgotMsg').style.color = 'var(--teal-700)';
  document.getElementById('forgotMsg').textContent = data.message || data.error;
}
</script>
<script src="/api/site-settings.js"></script>

</body>
</html>
