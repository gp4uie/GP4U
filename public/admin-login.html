<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — GP4U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/gp4u-icon.svg">
<!-- @head -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
<link rel="stylesheet" href="/css/style.css?v=8533d8cb">
<link rel="stylesheet" href="/css/clinic.css?v=1dce238e">
<!-- @/head -->
</head>
<body class="clinic-page staff-page">

<a class="skip-link" href="#main">Skip to main content</a>
<header class="site-header staff-header">
  <div class="nav-wrap">
    <a class="brand" href="/admin-login.html" aria-label="GP4U Clinic — Admin"><span class="brand-badge"><img src="/img/gp4u-icon-bright.svg" alt="" class="brand-mark"></span><span class="brand-text">GP4U<span class="brand-sub"> Clinic</span></span></a>
    <span class="staff-role">Admin</span>
    <nav class="main-nav" aria-label="Account">
      
    </nav>
  </div>
</header>
<main id="main">

<div class="page-shell" style="max-width:380px;">
  <h1>Admin Login</h1>
  <div class="form-row"><label>Email</label><input type="email" id="emailInput"></div>
  <div class="form-row"><label>Password</label><input type="password" id="passwordInput"></div>
  <button class="btn btn-primary btn-block" onclick="login()">Log In</button>
  <p id="loginError" style="color:#c0392b;"></p>
  <p><a href="#" id="forgotLink">Forgot your password?</a></p>

  <div id="forgotBox" style="display:none;">
    <div class="form-row"><label>Email</label><input type="email" id="forgotEmailInput"></div>
    <button class="btn btn-secondary btn-block" onclick="submitForgot()">Send Reset Link</button>
    <p id="forgotMsg"></p>
  </div>
</div>

</main>

<script>
async function login() {
  const email = document.getElementById('emailInput').value;
  const password = document.getElementById('passwordInput').value;
  const res = await fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json();
  if (res.ok) {
    window.location.href = '/admin-dashboard.html';
  } else {
    document.getElementById('loginError').textContent = data.error;
  }
}

document.getElementById('forgotLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('forgotBox').style.display = 'block';
  e.target.style.display = 'none';
});

async function submitForgot() {
  const email = document.getElementById('forgotEmailInput').value;
  const res = await fetch('/api/admin/forgot-password', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });
  const data = await res.json();
  document.getElementById('forgotMsg').style.color = 'var(--teal-700)';
  document.getElementById('forgotMsg').textContent = data.message || data.error;
}
</script>
<script src="/js/clinic.js?v=50ee1f5d"></script>
<script src="/js/nav-toggle.js?v=f65c51ad"></script>
</body>
</html>
