<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Consultation — GP4U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/gp4u-icon.svg">
<!-- @fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<!-- @/fonts -->
<link rel="stylesheet" href="/css/style.css?v=8533d8cb">
<style>
  .audio-only-call #localVideo { display: none; }
  .audio-only-call .audio-call-icon { display: flex; }
  .audio-call-icon {
    display: none;
    align-items: center;
    justify-content: center;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: #9fb3b8;
    font-size: 2.2rem;
  }
</style>
</head>
<body>
<div class="video-room">
  <div class="video-stage">
    <p id="status" style="color:#9fb3b8;">Setting up your camera and microphone…</p>
    <div class="audio-call-icon"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg></div>
    <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="video-controls">
    <button class="round-btn" id="micBtn" title="Mute/unmute" aria-label="Mute or unmute microphone"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
    <button class="round-btn" id="camBtn" title="Camera on/off" aria-label="Turn camera on or off"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></button>
    <button class="round-btn" id="fullscreenBtn" title="Fullscreen" aria-label="Toggle full screen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
    <button class="round-btn end" id="endBtn" title="End call" aria-label="End call"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg></button>
  </div>
</div>

<div id="endedOverlay" style="display:none; position:fixed; inset:0; background:#0e1b1e; color:white; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:10;">
  <p style="font-size:1.1rem;">Call ended.</p>
  <button class="btn btn-primary" onclick="window.close()">Close Window</button>
</div>

<script src="/js/peerjs.min.js?v=a1470acb"></script>
<script src="/js/consult.js?v=2f4667cd"></script>
</body>
</html>
