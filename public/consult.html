<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Consultation — GP4U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/gp4u-icon.svg">
<link rel="stylesheet" href="/css/style.css">
<style>
  .audio-only-call #localVideo { display: none; }
  .audio-only-call .audio-call-icon { display: flex; }
  .audio-call-icon {
    display: none;
    align-items: center;
    justify-content: center;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: #9fb3b8;
    font-size: 2.2rem;
  }
</style>
</head>
<body>
<div class="video-room">
  <div class="video-stage">
    <p id="status" style="color:#9fb3b8;">Setting up your camera and microphone…</p>
    <div class="audio-call-icon">🎧</div>
    <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
    <video id="localVideo" autoplay playsinline muted></video>
  </div>
  <div class="video-controls">
    <button class="round-btn" id="micBtn" title="Mute/unmute">🎤</button>
    <button class="round-btn" id="camBtn" title="Camera on/off">📷</button>
    <button class="round-btn" id="fullscreenBtn" title="Fullscreen">⛶</button>
    <button class="round-btn end" id="endBtn" title="End call">📞</button>
  </div>
</div>

<div id="endedOverlay" style="display:none; position:fixed; inset:0; background:#0e1b1e; color:white; flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:10;">
  <p style="font-size:1.1rem;">Call ended.</p>
  <button class="btn btn-primary" onclick="window.close()">Close Window</button>
</div>

<script src="/js/peerjs.min.js"></script>
<script src="/js/consult.js"></script>
</body>
</html>
