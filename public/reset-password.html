<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — GP4U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/gp4u-icon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="/index.html"><span class="brand-badge"><img src="/img/gp4u-icon-bright.svg" alt="" class="brand-mark"></span>GP4U</a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="main-nav"><a href="/index.html">Home</a></nav>
  </div>
</header>

<div class="page-shell" style="max-width:380px;">
  <h1>Set a New Password</h1>
  <div id="formBox">
    <div class="form-row"><label>New password</label><input type="password" id="passwordInput"></div>
    <div class="form-row"><label>Confirm password</label><input type="password" id="confirmInput"></div>
    <button class="btn btn-primary btn-block" onclick="submitReset()">Set Password</button>
  </div>
  <p id="resultMsg"></p>
</div>

<script>
const params = new URLSearchParams(location.search);
const type = params.get('type') === 'doctor' ? 'doctor' : 'patient';
const token = params.get('token');

if (!token) {
  document.getElementById('formBox').style.display = 'none';
  document.getElementById('resultMsg').textContent = 'This link is missing its reset token.';
}

async function submitReset() {
  const password = document.getElementById('passwordInput').value;
  const confirm = document.getElementById('confirmInput').value;
  const msg = document.getElementById('resultMsg');
  msg.style.color = '#c0392b';
  if (password.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; return; }
  if (password !== confirm) { msg.textContent = 'Passwords do not match.'; return; }

  const res = await fetch(`/api/${type}/reset-password`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, password }),
  });
  const data = await res.json();
  if (res.ok) {
    document.getElementById('formBox').style.display = 'none';
    msg.style.color = 'var(--teal-700)';
    msg.textContent = 'Password updated. Redirecting to log in…';
    setTimeout(() => {
      window.location.href = type === 'doctor' ? '/dashboard.html' : '/patient-login.html';
    }, 1500);
  } else {
    msg.textContent = data.error;
  }
}
</script>
<script src="/js/nav-toggle.js"></script>
</body>
</html>
