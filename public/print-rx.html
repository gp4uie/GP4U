<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prescription — GP4U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/gp4u-icon.svg">
<!-- @fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<!-- @/fonts -->
<link rel="stylesheet" href="/css/style.css?v=62977f52">
<style>
  body { background: white; }
  .letter { max-width: 680px; margin: 40px auto; padding: 30px; }
  .letterhead { border-bottom: 3px solid var(--teal-700); padding-bottom: 14px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .letterhead-brand { display: flex; align-items: center; gap: 10px; }
  .letterhead-brand img { width: 32px; height: 32px; flex-shrink: 0; }
  .letterhead h1 { color: var(--teal-900); margin: 0; font-size: 1.3rem; }
  .letterhead-slogan { margin: 4px 0 0; color: var(--ink-500); font-size: 0.85rem; }
  .letterhead-domain { margin: 0; color: var(--ink-500); font-size: 0.85rem; white-space: nowrap; }
  .field { margin-bottom: 10px; }
  .field label { font-weight: 700; display:block; font-size:0.82rem; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.03em; }
  .sig { margin-top: 50px; }
  .sig-name {
    font-family: "Segoe Script", "Bradley Hand", "Snell Roundhand", "Brush Script MT", cursive;
    font-size: 1.7rem;
    color: var(--teal-900);
    margin: 0 0 2px;
    padding: 0 6px 4px 0;
    border-bottom: 1px solid var(--ink-500);
    display: inline-block;
  }
  .sig-meta { margin: 6px 0 0; font-size: 0.85rem; color: var(--ink-500); }
  .letterhead-domain { text-align: right; line-height: 1.5; }
  .letter-footer { margin-top: 60px; padding-top: 10px; border-top: 1px solid #ddd; text-align: center; font-size: 0.72rem; color: var(--ink-500); line-height: 1.6; }
</style>
</head>
<body>
<div class="letter" id="letter">Loading…</div>
<div class="no-print" style="text-align:center; margin-bottom:30px;">
  <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
</div>

<script src="/js/print-letter.js?v=a197a20b"></script>
<script>
const params = new URLSearchParams(location.search);
const rxId = params.get('rxId');
const bookingId = params.get('bookingId');
const token = params.get('token');
const url = (bookingId && token)
  ? `/api/bookings/${bookingId}/prescriptions/${rxId}?token=${token}`
  : `/api/doctor/prescriptions/${rxId}`;

fetch(url).then((r) => r.json()).then((data) => {
  const L = window.PrintLetter;
  if (data.error) { document.getElementById('letter').textContent = data.error; return; }
  const { prescription: p, booking: b, practice } = data;
  const reference = 'RX-' + String(p.id).padStart(5, '0');
  document.getElementById('letter').innerHTML = `
    ${L.letterhead(practice)}
    <h2>Prescription</h2>
    ${L.patientFields(b)}
    ${L.field('Seen', L.visitLine(b))}
    ${L.field('Allergies', b.allergies)}
    ${L.field('Pharmacy', b.pharmacy_name)}
    <hr>
    <div class="field"><label>Medication</label><strong>${L.esc(p.medication)} — ${L.esc(p.dose)}</strong></div>
    ${L.field('Frequency', p.frequency)}${L.field('Duration', p.duration)}${L.field('Quantity', p.quantity)}${L.field('Instructions', p.instructions)}
    ${L.field('Date of issue', L.dateIE(p.issued_at))}
    ${L.signature(p.doctor_name, p.doctor_reg_number, practice)}
    ${L.footer(practice, reference, p.issued_at)}
  `;
}).catch(() => { document.getElementById('letter').textContent = 'This prescription could not be loaded.'; });
</script>
</body>
</html>
