<body class="clinic-page staff-page">

<header class="site-header staff-header">

    <nav class="main-nav" aria-label="Account">

      <a href="/" target="_blank" rel="noopener">View website ↗</a>
    </nav>
  </div>
</header>
<main id="main">

<div id="loginNotice" class="page-shell" style="display:none;">
  <div class="notice"><strong>Please log in</strong> Go to the <a href="/admin-login.html">admin login</a> and log in first, then come back to this page.</div>
</div>

<div id="siteBox" class="wide-shell" style="display:none;">
  <div class="dash-app">
    <nav class="dash-nav" id="siteNav" aria-label="Website settings">
      <p class="dash-group">Clinic</p>
      <button class="dash-link active" data-pane="details">Clinic details</button>
      <button class="dash-link" data-pane="hours">Opening hours &amp; closures</button>
      <button class="dash-link" data-pane="fees">Fees &amp; lead GP</button>
      <p class="dash-group">Website content</p>
      <button class="dash-link" data-pane="text">Page wording</button>
      <button class="dash-link" data-pane="photos">Photos</button>
      <button class="dash-link" data-pane="faq">FAQs</button>
      <button class="dash-link" data-pane="banner">Announcement bar</button>
      <p class="dash-group">More</p>
      <a class="dash-link" href="/content-editor.html">Services, prices &amp; health posts →</a>
      <button class="dash-link" data-pane="history">Change history</button>
    </nav>

    <div class="dash-main">
      <div class="page-head"><h1 id="paneTitle">Clinic details</h1><p id="paneSub"></p></div>
      <p id="paneMsg" role="status" class="staff-ok"></p>
      <p id="paneErr" role="alert" class="staff-error"></p>

      <section id="pane_details" class="site-pane"></section>
      <section id="pane_hours" class="site-pane" hidden></section>

      <section id="pane_faq" class="site-pane" hidden></section>
      <section id="pane_banner" class="site-pane" hidden></section>
      <section id="pane_history" class="site-pane" hidden></section>
    </div>
  </div>
</div>

</main>

<script src="/api/site-settings.js"></script>
