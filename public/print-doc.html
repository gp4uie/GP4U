<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document — GP4U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/gp4u-icon.svg">
<!-- @fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<!-- @/fonts -->
<link rel="stylesheet" href="/css/style.css?v=62977f52">
<style>
  body { background: white; }
  .letter { max-width: 680px; margin: 40px auto; padding: 30px; }
  .letterhead { border-bottom: 3px solid var(--teal-700); padding-bottom: 14px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .letterhead-brand { display: flex; align-items: center; gap: 10px; }
  .letterhead-brand img { width: 32px; height: 32px; flex-shrink: 0; }
  .letterhead h1 { color: var(--teal-900); margin: 0; font-size: 1.3rem; }
  .letterhead-slogan { margin: 4px 0 0; color: var(--ink-500); font-size: 0.85rem; }
  .letterhead-domain { margin: 0; color: var(--ink-500); font-size: 0.85rem; white-space: nowrap; }
  .field { margin-bottom: 10px; }
  .field label { font-weight: 700; display:block; font-size:0.82rem; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.03em; }
  .sig { margin-top: 50px; }
  .sig-name {
    font-family: "Segoe Script", "Bradley Hand", "Snell Roundhand", "Brush Script MT", cursive;
    font-size: 1.7rem;
    color: var(--teal-900);
    margin: 0 0 2px;
    padding: 0 6px 4px 0;
    border-bottom: 1px solid var(--ink-500);
    display: inline-block;
  }
  .sig-meta { margin: 6px 0 0; font-size: 0.85rem; color: var(--ink-500); }
  .body-text { white-space: pre-wrap; line-height: 1.6; }
  .letterhead-domain { text-align: right; line-height: 1.5; }
  .field { margin-bottom: 10px; }
  .field label { font-weight: 700; display:block; font-size:0.82rem; color: var(--ink-500); text-transform: uppercase; letter-spacing: 0.03em; }
  .letter-footer { margin-top: 60px; padding-top: 10px; border-top: 1px solid #ddd; text-align: center; font-size: 0.72rem; color: var(--ink-500); line-height: 1.6; }
</style>
</head>
<body>
<div class="letter" id="letter">Loading…</div>
<div class="no-print" style="text-align:center; margin-bottom:30px;">
  <button class="btn btn-primary" onclick="window.print()">Print / Save as PDF</button>
</div>

<script src="/js/print-letter.js?v=a197a20b"></script>
<script>
const params = new URLSearchParams(location.search);
const docId = params.get('docId');
const bookingId = params.get('bookingId');
const token = params.get('token');
const url = (bookingId && token)
  ? `/api/bookings/${bookingId}/documents/${docId}?token=${token}`
  : `/api/doctor/documents/${docId}`;

function renderSickCert(f, b, practice, doc) {
  const L = window.PrintLetter;
  return `
    ${L.letterhead(practice)}
    <h2>Medical Certificate</h2>
    ${L.patientFields(b)}
    ${L.field('Seen', L.visitLine(b))}
    <p class="body-text" style="margin-top:18px;">This is to certify that ${L.esc(b.patient_name)} was assessed by me and is ${L.esc(f.fitForWork)} from ${L.dateIE(f.dateFrom)} to ${L.dateIE(f.dateTo)} inclusive, due to: ${L.esc(f.diagnosis)}.</p>
    ${L.signature(doc.doctor_name, doc.doctor_reg_number, practice)}
    ${L.footer(practice, 'CERT-' + String(doc.id).padStart(5, '0'), doc.created_at)}
  `;
}

function renderReferral(f, b, practice, doc, isAE) {
  const L = window.PrintLetter;
  const toLine = isAE ? 'Emergency Department, ' + f.hospitalName : f.specialty + (f.consultantOrDept ? ' — ' + f.consultantOrDept : '');
  return `
    ${L.letterhead(practice)}
    <p style="color:var(--ink-500);">${L.dateIE(doc.created_at)}</p>
    ${L.field('To', toLine)}${L.field('Urgency', f.urgency)}
    <h3>Re: patient details</h3>
    ${L.patientFields(b, true)}
    ${L.field('Seen', L.visitLine(b))}${L.field('Allergies', b.allergies)}${L.field('Current medicines', b.current_medications)}
    <p style="margin-top:18px;">Dear Colleague,</p>
    <h3>Clinical summary</h3>
    <p class="body-text">${L.esc(f.clinicalSummary)}</p>
    <h3>Reason for referral</h3>
    <p class="body-text">${L.esc(f.reasonForReferral)}</p>
    <p>Thank you for seeing this patient. Please reply to ${L.esc([practice.email, practice.phone].filter(Boolean).join(' or ') || practice.name)}.</p>
    ${L.signature(doc.doctor_name, doc.doctor_reg_number, practice, true)}
    ${L.footer(practice, 'REF-' + String(doc.id).padStart(5, '0'), doc.created_at)}
  `;
}

fetch(url).then((r) => r.json()).then((data) => {
  if (data.error) { document.getElementById('letter').textContent = data.error; return; }
  const { document: doc, booking: b, practice } = data;
  const f = doc.fields;
  document.getElementById('letter').innerHTML = doc.doc_type === 'sick_cert'
    ? renderSickCert(f, b, practice, doc)
    : renderReferral(f, b, practice, doc, doc.doc_type === 'referral_ae');
}).catch(() => { document.getElementById('letter').textContent = 'This document could not be loaded.'; });
</script>
</body>
</html>
