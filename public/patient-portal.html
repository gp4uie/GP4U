<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings — GP4U</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/img/gp4u-icon.svg">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="/index.html"><span class="brand-badge"><img src="/img/gp4u-icon-bright.svg" alt="" class="brand-mark"></span>GP4U</a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <nav class="main-nav">
      <span id="whoami" style="color:var(--ink-500); font-size:0.85rem;"></span>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </div>
</header>

<div class="wide-shell">
  <div class="side-layout">
    <div class="side-nav">
      <button id="navBook" onclick="showSection('book')">Book a New Consultation</button>
      <button id="navPrevious" class="active" onclick="showSection('previous')">Previous Consultations <span id="unreadBadge" class="side-badge" style="display:none;">0</span></button>
      <button id="navDocuments" onclick="showSection('documents')">Documents Issued</button>
    </div>
    <div class="side-content">
      <div id="section_book" style="display:none;">
        <h1>Book a New Consultation</h1>
        <p style="color:var(--ink-500);">Choose a consultation type — your details are already saved, so you won't need to re-enter them.</p>
        <div class="grid" id="bookServiceChoices"></div>
      </div>
      <div id="section_previous">
        <h1>Previous Consultations</h1>
        <div class="table-scroll">
          <table class="bookings-table">
            <thead><tr><th>When</th><th>Service</th><th>Status</th><th></th><th></th></tr></thead>
            <tbody id="bookingsBody"></tbody>
          </table>
        </div>
      </div>
      <div id="section_documents" style="display:none;">
        <h1>Documents Issued</h1>
        <h3>Sick Certs &amp; Referral Letters</h3>
        <div id="documentsList"><p style="color:var(--ink-500);">None yet.</p></div>
        <h3 style="margin-top:24px;">Prescriptions</h3>
        <div id="prescriptionsList"><p style="color:var(--ink-500);">None yet.</p></div>
      </div>
    </div>
  </div>
</div>

<script>
const docTypeLabels = { sick_cert: 'Sick Certificate', referral_ae: 'Referral Letter — A&E', referral_specialist: 'Referral Letter — Specialist' };

const BOOK_SERVICE_ICONS = {
  general: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 4v16M4 12h16" stroke="#0f6e6e" stroke-width="2.5" stroke-linecap="round"/></svg>',
  audio: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="3" height="4" rx="1.5" fill="#0f6e6e"/><rect x="10.5" y="6" width="3" height="12" rx="1.5" fill="#0f6e6e"/><rect x="17" y="9" width="3" height="6" rx="1.5" fill="#0f6e6e"/></svg>',
  video: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="13" height="12" rx="3" stroke="#0f6e6e" stroke-width="2"/><path d="M16 10l5-3v10l-5-3z" fill="#0f6e6e"/></svg>',
  travel: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M21 3L3 10l7 3 3 7 8-17z" stroke="#0f6e6e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  womens: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.5-9.5-9C1 8 2.5 4 6.5 4c2 0 3.5 1.2 4.5 2.8C12 5.2 13.5 4 15.5 4c4 0 5.5 4 4 7-2.5 4.5-7.5 9-7.5 9z" stroke="#0f6e6e" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  repeat_rx: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3" stroke="#0f6e6e" stroke-width="2" stroke-linecap="round"/><path d="M18 3v4h-4M6 21v-4h4" stroke="#0f6e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  sick_cert: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2" stroke="#0f6e6e" stroke-width="2"/><path d="M8.5 12.5l2.3 2.3L15.5 10" stroke="#0f6e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  weight_loss: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M4 6l7 7 3-3 6 6M14 16h6v-6" stroke="#0f6e6e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

function showSection(name) {
  ['book', 'previous', 'documents'].forEach((s) => {
    document.getElementById('section_' + s).style.display = s === name ? 'block' : 'none';
  });
  document.getElementById('navBook').classList.toggle('active', name === 'book');
  document.getElementById('navPrevious').classList.toggle('active', name === 'previous');
  document.getElementById('navDocuments').classList.toggle('active', name === 'documents');
  if (name === 'book' && !document.getElementById('bookServiceChoices').dataset.loaded) {
    loadBookServices();
  }
}

async function loadBookServices() {
  const res = await fetch('/api/services');
  const services = await res.json();
  const grid = document.getElementById('bookServiceChoices');
  grid.dataset.loaded = '1';
  grid.innerHTML = Object.entries(services).map(([key, s]) => `
    <a class="card service-card" style="cursor:pointer; text-decoration:none; color:inherit;" href="/book.html?service=${key}">
      <div class="service-icon">${BOOK_SERVICE_ICONS[key] || BOOK_SERVICE_ICONS.general}</div>
      <h3>${s.label}</h3>
      <div class="service-price">€${(s.priceCents / 100).toFixed(2)}</div>
      <p style="color:var(--ink-500);font-size:0.85rem;">${s.durationMins} min appointment</p>
    </a>
  `).join('');
}

async function load() {
  const meRes = await fetch('/api/patient/me');
  const me = await meRes.json();
  if (!me.loggedIn) { window.location.href = '/patient-login.html'; return; }
  document.getElementById('whoami').textContent = me.email;

  const res = await fetch('/api/patient/bookings');
  const bookings = await res.json();
  const unreadCount = bookings.filter(b => b.hasUnread).length;
  const badge = document.getElementById('unreadBadge');
  if (unreadCount > 0) { badge.style.display = 'inline-block'; badge.textContent = unreadCount; }

  const body = document.getElementById('bookingsBody');
  body.innerHTML = bookings.length ? bookings.map(b => `
    <tr>
      <td>${new Date(b.slot_start).toLocaleString('en-IE', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</td>
      <td>${b.service_type.replace('_', ' ')}</td>
      <td><span class="badge ${b.status === 'completed' ? 'badge-green' : 'badge-amber'}">${b.status}</span></td>
      <td>${b.hasUnread ? '<span class="side-badge">New</span>' : ''}</td>
      <td><a class="btn btn-secondary" style="padding:6px 14px;font-size:0.85rem;" href="/confirmation.html?id=${b.id}&token=${b.token}">View</a></td>
    </tr>
  `).join('') : '<tr><td colspan="5" style="color:var(--ink-500);">No bookings yet.</td></tr>';

  const docsRes = await fetch('/api/patient/documents');
  const docsData = await docsRes.json();
  document.getElementById('documentsList').innerHTML = docsData.documents.length
    ? docsData.documents.map(d => `
        <div class="card" style="margin-bottom:10px;">
          <p><strong>${docTypeLabels[d.doc_type] || d.doc_type}</strong></p>
          <p style="color:var(--ink-500);font-size:0.85rem;">Issued ${new Date(d.created_at).toLocaleString('en-IE')} • ${d.service_type.replace('_', ' ')} consultation</p>
          <a class="btn btn-secondary" style="padding:6px 14px;font-size:0.85rem;" target="_blank" href="/print-doc.html?docId=${d.id}&bookingId=${d.booking_id}&token=${d.token}">View / Print</a>
        </div>
      `).join('')
    : '<p style="color:var(--ink-500);">None yet.</p>';

  document.getElementById('prescriptionsList').innerHTML = docsData.prescriptions.length
    ? docsData.prescriptions.map(p => `
        <div class="card" style="margin-bottom:10px;">
          <p><strong>${p.medication}</strong></p>
          <p style="color:var(--ink-500);font-size:0.85rem;">Issued ${new Date(p.created_at).toLocaleString('en-IE')} • ${p.service_type.replace('_', ' ')} consultation</p>
          <a class="btn btn-secondary" style="padding:6px 14px;font-size:0.85rem;" target="_blank" href="/print-rx.html?rxId=${p.id}&bookingId=${p.booking_id}&token=${p.token}">View / Print</a>
        </div>
      `).join('')
    : '<p style="color:var(--ink-500);">None yet.</p>';
}

document.getElementById('logoutLink').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/patient/logout', { method: 'POST' });
  window.location.href = '/index.html';
});

load();
</script>
<script src="/js/nav-toggle.js"></script>
</body>
</html>
