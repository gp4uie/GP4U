<form class="signup" id="clinic-news" data-signup="clinic_opening" novalidate>
  <h3>Be the first to know when we open</h3>
  <p>Get an email when our new walk-in GP clinic in Newbridge, Co. Kildare opens. Until then, you can <a href="/online-gp/">see a GP online</a>.</p>
  <div class="signup-row">
    <label class="sr-only" for="signupEmail">Email address</label>
    <input type="email" id="signupEmail" autocomplete="email" maxlength="255" placeholder="Your email address">
    <button type="submit" class="btn btn-primary">Notify me</button>
  </div>
  <label class="check-line"><input type="checkbox" id="signupConsent"> <span>Email me when the GP4U clinic in Newbridge opens, and with occasional GP4U updates. I can unsubscribe at any time.</span></label>
  <p data-signup-msg role="status"></p>
  <p class="fine">We only use your email address for this, and never share it. <a href="/privacy/#email-updates">How we handle it</a>.</p>
</form>
<script src="/js/signup.js" defer></script>
